workflows:
  svitlo-unsigned:
    name: Svitlo unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build without signing
        script: |
          set -o pipefail
          xcodebuild \
            -project Svitlo.xcodeproj \
            -scheme Svitlo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Svitlo.app Payload/
          zip -qr Svitlo.ipa Payload
    artifacts:
      - Svitlo.ipa
