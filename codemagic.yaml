workflows:
  svitlo-unsigned:
    name: Svitlo unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Restore folder layout
        script: |
          set -e
          mkdir -p Svitlo/Assets.xcassets/AppIcon.appiconset
          mv ./*.swift Svitlo/ 2>/dev/null || true
          if [ -f icon-1024.png ]; then mv icon-1024.png Svitlo/Assets.xcassets/AppIcon.appiconset/; fi
          cat > Svitlo/Assets.xcassets/Contents.json <<'EOF'
          { "info" : { "author" : "xcode", "version" : 1 } }
          EOF
          cat > Svitlo/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF'
          {
            "images" : [
              { "filename" : "icon-1024.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF
          rm -f "Contents.json" "Contents (1).json"
          ls -R Svitlo
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build without signing
        script: |
          set -o pipefail
          xcodebuild \
            -project Svitlo.xcodeproj \
            -scheme Svitlo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Svitlo.app Payload/
          zip -qr Svitlo.ipa Payload
    artifacts:
      - Svitlo.ipa
