workflows:
  ios-native-workflow:
    name: iOS Native Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic # Имя интеграции, которое ты задашь в настройках Codemagic
    environment:
      ios_signing:
        distribution_type: app_store # Варианты: app_store, ad_hoc, development, enterprise
        bundle_identifier: com.example.app # Замени на свой Bundle ID
      vars:
        XCODE_WORKSPACE: "YourApp.xcworkspace" # Замени на имя твоего .xcworkspace (или используй XCODE_PROJECT для .xcodeproj)
        XCODE_SCHEME: "YourApp" # Замени на имя твоей схемы в Xcode
        APP_STORE_APPLE_ID: 1234567890 # Числовой Apple ID приложения из App Store Connect
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          if [ -f "Podfile" ]; then
            pod install
          fi
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true